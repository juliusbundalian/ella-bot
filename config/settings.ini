[System]
start_level = 1a

[Speech]
use_mic = True
vosk_model = ./models/vosk-model-small-en-us-0.15
listen_seconds = 8
sample_rate = 16000

[TTS]
audio_feedback = True
tts_engine = piper
tts_rate = 240
piper_binary = ./piper/piper.exe
# Available models (all in ./models/):
#   en_US-amy-medium.onnx         <- Warm, young FEMALE voice (Ella's voice) ✅
#   en_US-lessac-medium.onnx      <- Male voice
#   en_US-libritts_r-medium.onnx  <- Multi-speaker (mixed)
#   en_GB-semaine-medium.onnx     <- Female, British accent
#   bmo.onnx                      <- BMO cartoon voice
piper_model = ./models/en_US-amy-medium.onnx
# Naturalness settings: lower noise_scale = flatter/more robotic. 0.667 is the sweet spot.
noise_scale = 0.667
noise_w = 0.8
length_scale = 1
volume = 4
pronunciation_overrides = ./config/pronunciation_overrides.json
kokoro_model = kokoro-v1.0.onnx
kokoro_voices = voices-v1.0.bin

[GUI]
gui = True
fullscreen = False
gui_width = 1280
gui_height = 720

