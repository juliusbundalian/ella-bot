[System]
# Starting level: easy, medium-a, medium-b, medium-c, hard
start_level = easy
sentence_file = ./config/sample_sentences.txt

[Speech]
use_mic = True
vosk_model = ./models/vosk-model-small-en-us-0.15
listen_seconds = 5

[TTS]
audio_feedback = True
tts_engine = auto
tts_rate = 150
pronunciation_overrides = ./config/pronunciation_overrides.json

[GUI]
gui = True
fullscreen = False
gui_width = 1280
gui_height = 720
