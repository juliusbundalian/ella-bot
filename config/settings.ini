[System]
# Starting level: 1a, 1b, 1c, 1d, 1e, 1f, 1g, 2a, 2b, 2c, 2d, 3, 4
start_level = 1a

[Speech]
use_mic = True
vosk_model = ./models/vosk-model-small-en-us-0.15
listen_seconds = 5
sample_rate = 16000

[TTS]
audio_feedback = True
tts_engine = piper
tts_rate = 190
# piper_binary is unused: Piper runs in-process via the piper-tts package.
# Available voice models (place the .onnx and matching .onnx.json in ./models/):
#   en_US-hfc_female-medium.onnx  <- Warm female voice (Ella's voice) ✅ default
#   en_US-amy-medium.onnx         <- Alternate young female voice
#   en_US-lessac-medium.onnx      <- Male voice
piper_model = ./models/en_US-hfc_female-medium.onnx
# Naturalness settings: lower noise_scale = flatter/more robotic. 0.667 is the sweet spot.
noise_scale = 0.667
noise_w = 0.8
length_scale = 1
pronunciation_overrides = ./config/pronunciation_overrides.json
# Kokoro TTS Models (Download to ./models/)
kokoro_model = kokoro-v1.0.onnx
kokoro_voices = voices-v1.0.bin

[GUI]
gui = True
fullscreen = False
gui_width = 1280
gui_height = 720
