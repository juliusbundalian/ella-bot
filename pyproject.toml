[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ella_bot"
version = "0.1.0"
description = "E.L.L.A. Offline Reading Assistant"
requires-python = ">=3.9"
dependencies = [
    "vosk",
    "sounddevice",
    "pygame-ce",
    "pyttsx3",
    "pronouncing",
    "numpy",
    "piper-tts>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
ella-bot = "ella_bot.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ella_bot*"]
